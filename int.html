<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>마을원 소개 | Poland</title>
<link rel="icon" href="covenant.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;900&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#190b2b;--panel:#27143f;--panel-2:#321a52;--line:#4b2b78;
  --text:#efe9f8;--muted:#ab9ec6;--silver:#d6cde6;--glow:#8f4fd6;
  --serif:'Noto Serif KR','Batang',serif;
  --sans:'Noto Sans KR','Malgun Gothic',sans-serif;
}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.7;min-height:100vh}
a{color:inherit}
:focus-visible{outline:3px solid var(--silver);outline-offset:3px}
.wrap{width:min(960px,92vw);margin-inline:auto}

.nav{border-bottom:1px solid var(--line);background:rgba(25,11,43,.92);position:sticky;top:0;z-index:5;backdrop-filter:blur(6px)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;min-height:56px;flex-wrap:wrap;padding-block:6px;gap:2px 12px}
.nav strong{font-family:var(--serif);font-weight:600}
.nav a{text-decoration:none;color:var(--muted);font-size:.95rem;padding:6px 12px;border-radius:6px}
.nav a:hover{color:var(--text);background:var(--panel)}
.nav .links{display:flex;gap:4px}
.nav a[aria-current]{color:var(--text)}

main{padding:44px 0 80px}
h1{font-family:var(--serif);font-weight:900;font-size:2.2rem;color:var(--silver)}
.sub{color:var(--muted);margin:6px 0 30px}

.layout{display:grid;grid-template-columns:1fr 320px;gap:28px;align-items:start}

/* 목록 */
.list h2{font-family:var(--serif);font-size:1.3rem;font-weight:600;margin:0 0 10px;padding-bottom:8px;border-bottom:2px solid var(--line)}
.list h2:not(:first-child){margin-top:28px}
.names{display:flex;flex-wrap:wrap;gap:10px}
.names button{
  display:flex;align-items:center;gap:10px;
  background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;
  padding:8px 16px 8px 8px;font:inherit;font-weight:700;cursor:pointer;transition:border-color .2s
}
.names button:hover{border-color:var(--glow)}
.names button[aria-pressed="true"]{border-color:var(--glow);background:var(--panel-2)}
.names .mini{width:34px;height:34px;border-radius:6px;overflow:hidden;border:1px solid var(--line);background:var(--bg)}
.skin-canvas{width:100%;height:100%;image-rendering:pixelated;object-fit:contain;display:block}
.hint{color:var(--muted);font-size:.9rem;margin-top:22px}
.tbox{margin-top:22px;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tbox h3{background:var(--panel-2);color:var(--silver);font-family:var(--serif);font-size:1.05rem;padding:8px 18px;border-bottom:1px solid var(--line)}
.tbox p{padding:14px 18px;color:#d9d0e8;min-height:3.2em}
.tbox p.empty{color:var(--muted);font-style:italic}
.tbox.quote{border-left:4px solid var(--glow)}

/* 프로필 박스 (나무위키 인포박스 느낌) */
.infobox{border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--panel);position:sticky;top:76px}
.infobox .title{background:var(--glow);color:#fff;text-align:center;font-family:var(--serif);font-weight:900;font-size:1.35rem;padding:10px}
.infobox .pic{background:linear-gradient(180deg,var(--panel-2),var(--bg));padding:20px 0;display:grid;place-items:center;border-bottom:1px solid var(--line)}
.infobox .pic .body-wrap{width:140px;height:280px}
.infobox table{width:100%;border-collapse:collapse}
.infobox th,.infobox td{padding:9px 12px;border-top:1px solid var(--line);text-align:left;vertical-align:middle}
.infobox th{width:84px;background:var(--panel-2);color:var(--silver);font-weight:500;font-size:.9rem;text-align:center}
.infobox td{word-break:break-all}

footer{border-top:1px solid var(--line);color:var(--muted);text-align:center;padding:24px 0;font-size:.85rem}
.back{display:inline-block;margin:34px 10px 0 0;text-decoration:none;font-weight:700;background:var(--glow);color:#fff;padding:12px 28px;border-radius:999px}
.back:hover{background:#a566ea}

@media (max-width:760px){
  .layout{grid-template-columns:1fr}
  .infobox{order:-1;position:static}
}
@media (max-width:520px){.nav a{padding:6px 8px;font-size:.85rem}.nav strong{font-size:.95rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="nav">
  <div class="wrap">
    <strong>Poland</strong>
    <nav class="links">
      <a href="index.html">마을 소개</a>
      <a href="int.html" aria-current="page">마을원 소개</a>
      <a href="str.html">커버넌트 · 폴란드</a>
      <a href="bool.html">뉴비 가이드</a>
      <a href="floot.html">디스코드</a>
      <a href="rules.html">서버 규정</a>
    </nav>
  </div>
</header>

<main>
  <div class="wrap">
    <h1>마을원 소개</h1>
    <p class="sub">이름을 누르면 오른쪽 프로필이 바뀌어요.</p>

    <div class="layout">
      <div class="list">
        <h2>시장</h2>
        <div class="names" id="mayor"></div>
        <h2>부시장</h2>
        <div class="names" id="deputies"></div>
        <div class="tbox"><h3>소개글</h3><p id="desc"></p></div>
        <div class="tbox quote"><h3>한마디</h3><p id="quote"></p></div>
        <a class="back" href="index.html">마을 소개로 돌아가기</a>
        <a class="back" href="str.html">커버넌트 · 폴란드 설명 보기</a>
      </div>

      <aside class="infobox" aria-live="polite">
        <div class="title" id="p-title">-</div>
        <div class="pic"><div class="body-wrap" id="p-pic"></div></div>
        <table>
          <tr><th>이름</th><td id="p-name"></td></tr>
          <tr><th>닉네임</th><td id="p-nick"></td></tr>
          <tr><th>직급</th><td id="p-rank"></td></tr>
          <tr><th>소속</th><td>Poland (The Covenant)</td></tr>
        </table>
      </aside>
    </div>
  </div>
</main>

<footer>Poland · The Covenant · Planet Earth 마을 가이드</footer>

<script src="members.js"></script>
<script>
const buttons = {};
function fill(id, text, empty){
  const el = document.getElementById(id);
  el.textContent = text || empty;
  el.classList.toggle('empty', !text);
}
async function select(m){
  Object.entries(buttons).forEach(([k,b]) => b.setAttribute('aria-pressed', k === m.nick));
  document.getElementById('p-title').textContent = m.name;
  document.getElementById('p-name').textContent = m.name;
  document.getElementById('p-nick').textContent = m.nick;
  document.getElementById('p-rank').textContent = m.rank;
  fill('desc', m.desc, '소개글이 아직 없어요.');
  fill('quote', m.quote, '한마디가 아직 없어요.');
  document.getElementById('p-pic').replaceChildren(await drawBody(m));
  history.replaceState(null, '', '#' + m.nick);
}

(async () => {
  for(const m of MEMBERS){
    const b = document.createElement('button');
    b.type = 'button';
    const mini = document.createElement('span');
    mini.className = 'mini';
    mini.appendChild(await drawHead(m));
    b.append(mini, m.name);
    b.setAttribute('aria-pressed','false');
    b.onclick = () => select(m);
    buttons[m.nick] = b;
    document.getElementById(m.rank === '시장' ? 'mayor' : 'deputies').appendChild(b);
  }
  const want = decodeURIComponent(location.hash.slice(1));
  select(MEMBERS.find(m => m.nick === want) || MEMBERS[0]);
})();
</script>
</body>
</html>
